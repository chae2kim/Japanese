<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<meta name="theme-color" content="#F8F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1F24" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="N3">
<meta name="description" content="JLPT N3 예문 중심 학습 덱">
<title>N3 예문장</title>
<style>
:root{
  --paper:#EFEDFA;
  --card:#FFFFFF;
  --ink:#2E3140;
  --indigo:#6C4FE0;
  --indigo-soft:#EFEBFD;
  --vermilion:#F0608E;
  --muted:#9A9BB0;
  --line:#EAE8F6;
  --radius:22px;
  --sh:0 2px 16px rgba(60,50,120,.07);
  --sh2:0 6px 24px rgba(60,50,120,.12);
  --sys-ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  --sys-jp:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Hiragino Sans","Yu Gothic Medium",sans-serif;
  --ui:"Gowun Dodum",var(--sys-ui);
  --jp:"M PLUS Rounded 1c","Gowun Dodum",var(--sys-jp);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#15141F; --card:#201F2E; --ink:#E9E8F2; --indigo:#A992F5;
    --indigo-soft:#2B2740; --vermilion:#F58AAE; --muted:#8E8DA6; --line:#2E2C41;
    --sh:0 2px 16px rgba(0,0,0,.3); --sh2:0 6px 24px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{overscroll-behavior-y:none}
body{
  background:var(--paper); color:var(--ink); font-family:var(--ui);
  font-size:16px; line-height:1.68; letter-spacing:-.005em;
  padding-bottom:calc(82px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
body.sysfont{--ui:var(--sys-ui);--jp:var(--sys-jp)}
body{--gr:linear-gradient(135deg,#5470E8,#8A5CF0)}

/* ── 상단 바 ── */
header{
  position:sticky; top:0; z-index:20; background:var(--paper);
  padding:calc(12px + env(safe-area-inset-top)) 16px 0;
}
.bar{display:flex;align-items:center;gap:6px;padding-bottom:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--gr,linear-gradient(135deg,#5470E8,#8A5CF0));
  display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;box-shadow:var(--sh)}
.hi{display:flex;flex-direction:column;line-height:1.3;min-width:0;margin-left:2px}
.hi b{font-family:var(--jp);font-size:14.5px;font-weight:700;white-space:nowrap}
.hi i{font-style:normal;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ib{width:37px;height:37px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  border-radius:13px;background:var(--card);color:var(--muted);font-size:12px;box-shadow:var(--sh);
  font-variant-numeric:tabular-nums}
.ib .ic{width:17px;height:17px}
.ib[aria-pressed="true"]{color:var(--indigo)}
#rate{margin-left:auto;font-size:11px}
#furi{font-family:var(--jp);font-size:15px}

.chips{display:flex;gap:7px;overflow-x:auto;padding:3px 0 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:13px;padding:9px 15px;border-radius:999px;border:0;background:var(--card);
  color:var(--muted);white-space:nowrap;scroll-snap-align:start;box-shadow:var(--sh);font-weight:500}
.chip[aria-pressed="true"]{background:var(--gr);color:#fff;box-shadow:var(--sh2)}
.chip.weak[aria-pressed="true"]{background:linear-gradient(135deg,#F2609A,#F0855E)}

/* ── 진도 ── */

main{padding:0 0 24px}

/* ── 카드 ── */
.card{
  background:var(--card); border:0; border-radius:var(--radius);
  padding:20px 19px 14px; margin-bottom:13px; box-shadow:var(--sh);
}
.card.done{opacity:.5}
.card.weak{box-shadow:var(--sh),inset 4px 0 0 var(--vermilion);padding-left:21px}

.pat{font-family:var(--jp);font-size:19px;font-weight:600;color:var(--indigo);letter-spacing:.02em}
.mean{font-size:14px;margin-top:2px}
.conn{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--jp)}

.jp{
  font-family:var(--jp); font-size:clamp(19px,5.4vw,22px); line-height:2.45;
  margin:16px 0 0; letter-spacing:.005em; word-break:keep-all;
}
.jp ruby rt{font-size:.45em;color:var(--muted);font-weight:400;transition:opacity .15s}
body.nofuri .jp ruby rt{opacity:0}
.mk{border-bottom:2px solid var(--indigo);padding-bottom:2px}

.tr{
  margin-top:10px; font-size:14px; color:var(--muted);
  border-top:1px dashed var(--line); padding-top:10px;
}
.tr[hidden]{display:none}
.reveal{font-size:13px;color:var(--indigo);margin-top:10px;border-top:1px dashed var(--line);padding-top:13px;padding-bottom:5px;width:100%;text-align:left}

/* 단어 목록 */
.words{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.words li{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.words li:last-child{border-bottom:0}
.w-k{font-family:var(--jp);font-weight:600;min-width:80px}
.w-r{font-family:var(--jp);font-size:12.5px;color:var(--indigo);min-width:82px}
.w-m{color:var(--muted);font-size:13px}

/* 액션 */
.acts{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.act{font-size:12.5px;padding:10px 16px;border:0;background:var(--paper);border-radius:999px;color:var(--muted);min-height:40px}
.act[aria-pressed="true"]{color:var(--indigo);background:var(--indigo-soft);font-weight:600}
.act.wk[aria-pressed="true"]{color:var(--vermilion);background:var(--paper)}

/* ── 독해 ── */
.doc-title{font-size:12px;color:var(--muted);margin-bottom:8px}
.doc{font-family:var(--jp);font-size:clamp(16px,4.5vw,18px);line-height:2.35;text-align:justify;word-break:keep-all}
.doc ruby rt{font-size:.45em;color:var(--muted)}
body.nofuri .doc ruby rt{opacity:0}
.q{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.qno{font-size:11.5px;color:var(--indigo);margin-bottom:7px;font-weight:600}
.doc + .say + .dtb{margin-top:16px}
.q-txt{font-family:var(--jp);font-size:clamp(16px,4.5vw,17.5px);line-height:1.9;margin-bottom:10px;word-break:keep-all}
.opt{display:block;width:100%;text-align:left;font-family:var(--jp);font-size:15.5px;padding:14px 16px;border:0;background:var(--paper);border-radius:16px;margin-bottom:8px;line-height:1.75}
.opt.ok{background:var(--indigo-soft);color:var(--indigo);font-weight:700;box-shadow:inset 0 0 0 2px var(--indigo)}
.opt.no{color:var(--muted);text-decoration:line-through;opacity:.6}

/* ── 헷갈리는 한자 ── */
.kgrp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kkey{font-family:var(--jp);font-size:20px;font-weight:600;color:var(--indigo);letter-spacing:.02em}
.kty{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.kitem{display:flex;gap:14px;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.kch{font-family:var(--jp);font-size:36px;line-height:1.05;flex:0 0 46px;text-align:center}
.kbody{flex:1;min-width:0}
.kread{font-family:var(--jp);font-size:12.5px;color:var(--indigo)}
.kkr{font-size:12px;color:var(--muted);margin-left:6px}
.kpt{font-size:13.5px;margin-top:2px}
.kex{font-family:var(--jp);font-size:clamp(16px,4.4vw,17.5px);line-height:2.15;margin-top:6px;word-break:keep-all}
.kex ruby rt{font-size:.45em;color:var(--muted)}
body.nofuri .kex ruby rt{opacity:0}
.kext{font-size:12.5px;color:var(--muted);margin-top:2px}
.ktip{margin-top:14px;border-top:1px solid var(--line);padding-top:11px;font-size:13px;color:var(--vermilion);line-height:1.75}

/* ── 문법 구분 ── */
.drule{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6}
.ditem{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.dn{display:inline-block;font-family:var(--jp);font-size:15.5px;font-weight:700;color:var(--indigo);
  background:var(--indigo-soft);border-radius:999px;padding:4px 12px}
.dpt{font-size:13.5px;margin-top:6px;color:var(--muted)}
.dtb{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
.dtb th{font-size:11.5px;color:var(--muted);font-weight:500;text-align:left;
  padding:0 8px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.dtb td{font-family:var(--jp);padding:9px 8px 9px 0;border-bottom:1px solid var(--line);
  vertical-align:top;line-height:1.75;word-break:keep-all}
.dtb td:last-child{font-family:var(--ui);font-size:12.5px;color:var(--muted)}
.dtb tr:last-child td{border-bottom:0}
.dtb ruby rt{font-size:.45em;color:var(--muted)}
body.nofuri .dtb ruby rt{opacity:0}

/* ── 탭별 색상 ── */
body[data-tab="g"]{--indigo:#4F6FE5;--indigo-soft:#EAEEFD;--gr:linear-gradient(135deg,#5470E8,#8A5CF0)}
body[data-tab="v"]{--indigo:#17A87C;--indigo-soft:#E6F6F0;--gr:linear-gradient(135deg,#25BC8C,#2E9FD4)}
body[data-tab="d"]{--indigo:#8B4FD8;--indigo-soft:#F2EAFC;--gr:linear-gradient(135deg,#9256E8,#CC5AD0)}
body[data-tab="k"]{--indigo:#DB7A2A;--indigo-soft:#FDF0E3;--gr:linear-gradient(135deg,#F0993C,#EE6A55)}
body[data-tab="c"]{--indigo:#0E9E9A;--indigo-soft:#E2F5F4;--gr:linear-gradient(135deg,#1CB9B1,#3C8DE2)}
body[data-tab="r"]{--indigo:#E04F86;--indigo-soft:#FDEAF1;--gr:linear-gradient(135deg,#F2609A,#F0855E)}
@media (prefers-color-scheme: dark){
  body[data-tab="g"]{--indigo:#93A6F5;--indigo-soft:#252A44}
  body[data-tab="v"]{--indigo:#63D3AC;--indigo-soft:#1D3830}
  body[data-tab="d"]{--indigo:#BC90F0;--indigo-soft:#2E2444}
  body[data-tab="k"]{--indigo:#F0AE6E;--indigo-soft:#3A2B1E}
  body[data-tab="c"]{--indigo:#5CD2CB;--indigo-soft:#1C3838}
  body[data-tab="r"]{--indigo:#F78BB2;--indigo-soft:#3B2330}
}
nav button[data-tab="g"]{--c:#5470E8;--g:linear-gradient(135deg,#5470E8,#8A5CF0)}
nav button[data-tab="v"]{--c:#25BC8C;--g:linear-gradient(135deg,#25BC8C,#2E9FD4)}
nav button[data-tab="d"]{--c:#9256E8;--g:linear-gradient(135deg,#9256E8,#CC5AD0)}
nav button[data-tab="k"]{--c:#EE8A45;--g:linear-gradient(135deg,#F0993C,#EE6A55)}
nav button[data-tab="c"]{--c:#1CB9B1;--g:linear-gradient(135deg,#1CB9B1,#3C8DE2)}
nav button[data-tab="r"]{--c:#F2609A;--g:linear-gradient(135deg,#F2609A,#F0855E)}
nav button .ic{color:var(--c);opacity:.45;transition:opacity .15s}
nav button[aria-selected="true"]{color:var(--c);font-weight:700}
nav button[aria-selected="true"] .ic{opacity:1}

.vcat[data-c="time"]{--vc:#D0904A}.vcat[data-c="work"]{--vc:#4E87AE}
.vcat[data-c="study"]{--vc:#5C9E7A}.vcat[data-c="move"]{--vc:#3F9D9A}
.vcat[data-c="money"]{--vc:#BF9A2E}.vcat[data-c="people"]{--vc:#8A7BC0}
.vcat[data-c="heart"]{--vc:#C97392}.vcat[data-c="nature"]{--vc:#5FA050}
.vcat[data-c="world"]{--vc:#5786C4}.vcat[data-c="tech"]{--vc:#7C8894}
.vcat[data-c="adv"]{--vc:#D4833C}.vcat[data-c="syn"]{--vc:#9179C0}
.vcat[data-c="verb"]{--vc:#C4564B}
.vcat .ic{color:var(--vc)}

/* ── 히어로 배너 ── */
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
.hero{background:var(--gr);border-radius:24px;padding:20px 20px 18px;color:#fff;
  display:flex;align-items:center;gap:14px;box-shadow:var(--sh2);margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-34px;bottom:-46px;width:132px;height:132px;
  border-radius:50%;background:rgba(255,255,255,.13)}
.hero .hcol{flex:1;min-width:0;position:relative;z-index:1}
.hkick{font-size:11.5px;opacity:.85;font-variant-numeric:tabular-nums}
.htitle{font-size:24px;font-weight:700;line-height:1.25;margin:2px 0 8px;letter-spacing:-.01em}
.hsub{font-size:11.5px;opacity:.9;font-variant-numeric:tabular-nums;margin-bottom:9px}
.htrack{height:6px;background:rgba(255,255,255,.28);border-radius:999px;overflow:hidden}
.hfill{display:block;height:100%;background:#fff;width:0;border-radius:999px;transition:width .35s ease}
.hero .mochi{color:#fff;position:relative;z-index:1;flex:0 0 auto}
.hero .mochi .cheek{color:#fff;opacity:.55}
.chip.now{color:var(--indigo)}
.chip.now[aria-pressed="true"]{color:#fff}

#pager{position:fixed;left:0;right:0;z-index:19;display:flex;align-items:center;justify-content:center;
  gap:6px;bottom:calc(68px + env(safe-area-inset-bottom));pointer-events:none}
#pager[hidden]{display:none}
#pager button,#pager .pt{pointer-events:auto;background:var(--card);border:0;box-shadow:var(--sh2)}
#pager button{width:52px;height:46px;border-radius:16px;display:flex;align-items:center;
  justify-content:center;color:var(--indigo);font-size:19px}
#pager button:disabled{color:var(--muted);opacity:.4}
#pager .pt{height:46px;display:flex;align-items:center;padding:0 16px;border-radius:14px;
  font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
body.onecard{padding-bottom:calc(128px + env(safe-area-inset-bottom))}

/* ── 음성 ── */
.say{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);
  border:0;background:var(--paper);border-radius:999px;padding:8px 15px;margin-top:11px;min-height:36px}
.say .ic{width:14px;height:14px}
.say.on{color:var(--indigo);border-color:var(--indigo);background:var(--indigo-soft)}
.kitem .say,.ditem .say{margin-top:8px;padding:5px 11px;font-size:11.5px;min-height:30px}
.wsay{cursor:pointer}
.wsay.on .w-k{color:var(--indigo)}
.spmsg{font-size:12.5px;color:var(--vermilion);margin-top:10px;line-height:1.6}

/* ── 아이콘 · 마스코트 · 그림 ── */
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:0 0 auto}
nav .ic{width:20px;height:20px;display:block}
.mochi{display:block;color:var(--indigo);flex:0 0 auto}
.mochi .cheek{color:var(--vermilion)}
.vcat{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:12px}
.vcat .ic{width:15px;height:15px}
.pic{width:100%;height:auto;margin:14px 0 4px;color:var(--muted)}
.pic .c-a{color:var(--indigo)}
.pic .c-b{color:var(--vermilion)}
.pic .sep{stroke:var(--line)}
.pic .pl{font-family:var(--jp);font-size:13px;fill:currentColor;stroke:none}
.pic .ps{font-family:var(--ui);font-size:10.5px;fill:var(--muted);stroke:none}
.react{display:flex;align-items:center;gap:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.react .msg{font-size:13px;line-height:1.6}
.react.hit .msg{color:var(--indigo)}
.react.miss .msg{color:var(--vermilion)}
.react.miss .mochi{color:var(--vermilion)}
.empty .mochi{margin:0 auto 14px}

/* ── 하단 탭 ── */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:var(--card); box-shadow:0 -2px 20px rgba(60,50,120,.09);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;padding:9px 0 8px;font-size:10.5px;color:var(--muted);letter-spacing:-.02em;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.nb{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  transition:background .2s ease}
nav button[aria-selected="true"] .nb{background:var(--g)}
nav button[aria-selected="true"] .nb .ic{color:#fff;opacity:1}
nav button[aria-selected="true"]{color:var(--indigo);border-top-color:var(--indigo);font-weight:600}

.empty{text-align:center;color:var(--muted);font-size:14px;padding:52px 20px;line-height:1.9}
</style>
</head>
<body>

<header>
  <div class="bar">
    <span class="avatar" id="avatar"></span>
    <span class="hi"><b>日本語 N3</b><i id="dday"></i></span>
    <button class="ib" id="rate" title="재생 속도">×.85</button>
    <button class="ib" id="furi" aria-pressed="true" title="후리가나">ふ</button>
    <button class="ib" id="font" aria-pressed="true" title="글씨체">Aa</button>
    <button class="ib" id="mode" title="보기 방식"></button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<div class="wrap">
  <section class="hero" id="hero"></section>
  <main id="list"></main>
</div>

<div id="pager" hidden>
  <button id="prev" aria-label="이전">‹</button>
  <span class="pt" id="pageTxt"></span>
  <button id="next" aria-label="다음">›</button>
</div>

<nav>
  <button data-tab="g" aria-selected="true" data-ic="gram">문법</button>
  <button data-tab="v" aria-selected="false" data-ic="word">어휘</button>
  <button data-tab="d" aria-selected="false" data-ic="dist">구분</button>
  <button data-tab="k" aria-selected="false" data-ic="kanji">한자</button>
  <button data-tab="c" aria-selected="false" data-ic="conj">활용</button>
  <button data-tab="r" aria-selected="false" data-ic="read">독해</button>
</nav>

<script>
const EXAM = new Date(2026,11,7); // 12/7

/* ─────────── 문법 150 ─────────── */
const G=[
{id:'g1',w:1,p:'～たところだ',m:'막 ~한 참이다',c:'동사 た형 + ところだ',e:'今{いま}、 駅{えき}に **着{つ}いたところ**です。',t:'지금 막 역에 도착했습니다.'},
{id:'g2',w:1,p:'～たばかりだ',m:'~한 지 얼마 안 됐다',c:'동사 た형 + ばかりだ',e:'日本{にほん}に **来{き}たばかり**で、まだ 慣{な}れていません。',t:'일본에 온 지 얼마 안 돼서 아직 익숙하지 않습니다.'},

const FORMS=[['pas','수동형'],['cau','사역형'],['cp','사역수동형'],['pot','가능형']];
const GN={1:'1그룹',2:'2그룹',3:'3그룹'};
const RULE={
 '1pas':'ない형 어간 + れる','1cau':'ない형 어간 + せる',
 '1cp':'ない형 어간 + される. せられる가 줄어든 형태다.','1pot':'어미를 e단으로 바꾸고 + る',
 '2pas':'る를 떼고 + られる','2cau':'る를 떼고 + させる',
 '2cp':'る를 떼고 + させられる. 축약하지 않는다.','2pot':'る를 떼고 + られる',
 '3pas':'불규칙. 통째로 외운다.','3cau':'불규칙. 통째로 외운다.',
 '3cp':'불규칙. 통째로 외운다.','3pot':'불규칙. 통째로 외운다.'};
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const HIT=['정답입니다.','잘 잡으셨어요.','바로 그거예요.','깔끔합니다.'];
const MISS=['아쉽네요. 아래 규칙을 한 번 보세요.','★약함에 담아뒀어요. 나중에 다시 만납니다.','괜찮아요. 여기서 많이들 걸립니다.','한 번 더 보면 잡힙니다.'];

const C=(function(){
  const out=[]; let n=0;
  VB.forEach(vb=>{
    FORMS.forEach(([k,label])=>{
      if(!vb.f[k]) return;
      const ans=vb.f[k];
      const pool=['pas','cau','cp','pot','neg']
        .filter(x=>x!==k && vb.f[x] && vb.f[x]!==ans).slice(0,3).map(x=>vb.f[x]);
      const o=shuf([ans,...pool]);
      n++;
      out.push({id:'c'+n,w:n%12+1,ttl:`${GN[vb.g]} · ${vb.m}`,
        q:`「${vb.v}」의 ${label}은?`,o,a:o.indexOf(ans),tip:vb.n||RULE[vb.g+k]});
    });
  });
  TP.forEach(t=>{
    [[t.a,t.ka,'が'],[t.b,t.kb,'を']].forEach(([ans,kr,p])=>{
      const o=shuf([t.a,t.b]); n++;
      out.push({id:'c'+n,w:n%12+1,ttl:'자동사 · 타동사',
        q:`${t.s}${p} ＿＿＿。 — ${kr}`,o,a:o.indexOf(ans),
        tip:'が가 붙으면 자동사, を가 붙으면 타동사.'});
    });
  });
  return out;
})();

const SP={
  rates:[0.7,0.85,1],
  i:1,
  el:null,
  ok:typeof speechSynthesis!=='undefined',
  voice:null,
  pick(){
    if(!this.ok) return null;
    const vs=speechSynthesis.getVoices()||[];
    this.voice = vs.find(v=>/^ja[-_]/i.test(v.lang)) || vs.find(v=>/japan/i.test(v.name)) || null;
    return this.voice;
  },
  text(el){
    const c=el.cloneNode(true);
    c.querySelectorAll('rt').forEach(n=>n.remove());
    return c.textContent.replace(/\s+/g,'').trim();
  },
  stop(){
    if(this.ok) speechSynthesis.cancel();
    document.querySelectorAll('.say.on').forEach(b=>b.classList.remove('on'));
    this.el=null;
  },
  say(txt,btn){
    if(!this.ok){ return '이 브라우저는 음성 재생을 지원하지 않습니다.'; }
    const same=this.el===btn && speechSynthesis.speaking;
    this.stop();
    if(same) return null;
    if(!this.voice) this.pick();
    if(!this.voice) return '기기에 일본어 음성이 없습니다. 설정에서 일본어를 추가해 주세요.';
    const u=new SpeechSynthesisUtterance(txt);
    u.voice=this.voice; u.lang='ja-JP'; u.rate=this.rates[this.i]; u.pitch=1;
    u.onend=u.onerror=()=>{ if(btn) btn.classList.remove('on'); };
    if(btn){ btn.classList.add('on'); this.el=btn; }
    speechSynthesis.speak(u);
    return null;
  }
};
if(SP.ok){
  SP.pick();
  speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',()=>SP.pick());
}

function ruby(s){
  return s.replace(/\*\*([\s\S]+?)\*\*/g,'<span class="mk">$1</span>')
          .replace(/([\u4e00-\u9faf々ヶ]+)\{([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
}

function nowWeek(){
  const t=new Date(); t.setHours(0,0,0,0);
  const left=Math.ceil((EXAM-t)/86400000);
  if(left<=0) return 12;
  return Math.min(12,Math.max(1,12-Math.floor((left-1)/7)));
}

  const sw=localStorage.getItem('n3deck:week');

/* 저장소: 아티팩트 환경이면 window.storage, 아니면 브라우저 localStorage */
const store={
  async get(){
    try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(KEY); return r&&r.value; } }catch(e){}
    try{ return localStorage.getItem(KEY); }catch(e){ return null; }
  },
  async set(v){
    try{ if(window.storage&&window.storage.set){ await window.storage.set(KEY,v); return; } }catch(e){}
    try{ localStorage.setItem(KEY,v); }catch(e){}
  }
};
async function load(){
  try{ const v=await store.get(); if(v) st=JSON.parse(v); }catch(e){}
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{ store.set(JSON.stringify(st)); },400);
}

/* ─────────── 그리기 ─────────── */
function render(){
  const items=filtered();
  const el=document.getElementById('list');
  const draw=({g:cardG,v:cardV,r:cardR,k:cardK,d:cardD,c:cardC}[tab]);
  document.body.dataset.tab=tab;
  document.body.classList.toggle('onecard',mode==='one'&&items.length>0);
  const pg=document.getElementById('pager');
  if(mode==='one'&&items.length){
    if(idx>=items.length) idx=0;
    if(idx<0) idx=items.length-1;
    el.innerHTML=draw(items[idx]);
    pg.hidden=false;
    document.getElementById('pageTxt').textContent=`${idx+1} / ${items.length}`;
    document.getElementById('prev').disabled=idx===0;
    document.getElementById('next').disabled=idx===items.length-1;
    prog(); window.scrollTo(0,0); return;
  }
  pg.hidden=true;
  el.innerHTML = items.length
    ? items.map(x=>draw(x)).join('')
    : `<div class="empty">${mochi(week==='weak'?'proud':'sleep',64)}${week==='weak'
        ? '약한 항목이 없습니다.<br>지금은 전부 잡혀 있어요.'
        : '여기는 아직 비어 있습니다.<br>다른 주차를 골라 보세요.'}</div>`;
  prog();
  window.scrollTo(0,0);
}
const TABNAME={g:'문법',v:'어휘·한자',d:'헷갈리는 문법',k:'헷갈리는 한자',c:'동사 활용',r:'독해'};
function prog(){
  const d=data(), done=d.filter(x=>st.done[x.id]).length;
  const pct=d.length?done/d.length*100:0;
  let at=0,ad=0;
  ALLSETS().forEach(set=>{ at+=set.length; ad+=set.filter(x=>st.done[x.id]).length; });
  const ap=at?ad/at*100:0;
  const scope = week==='all'?'전체':week==='weak'?'★ 약한 것':week+'주차';
  const mood=ap===0?'sleep':ap>=100?'proud':ap>=50?'happy':'ok';
  document.getElementById('hero').innerHTML=`
    <div class="hcol">
      <div class="hkick">${scope} · ${d.length}개</div>
      <div class="htitle">${TABNAME[tab]}</div>
      <div class="hsub">이 탭 ${done}/${d.length} · 전체 ${ad}/${at} (${Math.round(ap)}%)</div>
      <span class="htrack"><span class="hfill" style="width:${pct}%"></span></span>
    </div>${mochi(mood,52)}`;
}

function chips(){
  const c=document.getElementById('chips');
  const list=[['all','전체'],['weak','★ 약함']].concat(
    Array.from({length:12},(_,i)=>[String(i+1),(i+1)+'주']));
  c.innerHTML=list.map(([v,l])=>
    `<button class="chip ${v==='weak'?'weak':''} ${v===String(NOWW)?'now':''}" data-w="${v}"
      aria-pressed="${week===v}">${l}${v===String(NOWW)?' ·':''}</button>`).join('');
}

  if(say){
    const src=say.previousElementSibling;
    const err=SP.say(SP.text(src),say);
    let m=card.querySelector('.spmsg');
    if(err){ if(!m){ m=document.createElement('div'); m.className='spmsg'; say.after(m);} m.textContent=err; }
    else if(m){ m.remove(); }
    return;
  }
  const wsay=e.target.closest('.wsay');
  if(wsay){
    document.querySelectorAll('.wsay.on').forEach(n=>n.classList.remove('on'));
    wsay.classList.add('on');
    SP.say(wsay.querySelector('.w-k').textContent,null);
    setTimeout(()=>wsay.classList.remove('on'),1200);
    return;
  }

  const rv=e.target.closest('.reveal');
  if(rv){ const tr=card.querySelector('.tr'); tr.hidden=!tr.hidden; rv.textContent=tr.hidden?rv.textContent.replace('숨기기','보기'):rv.textContent.replace('보기','숨기기'); return; }

  const opt=e.target.closest('.opt');
  if(opt){
    const src=(tab==='c'?C:R).find(o=>o.id===id); if(!src) return;
    const blk=opt.closest('.q');
    const ans = tab==='c' ? src.a : qsOf(src)[+(blk.dataset.q||0)].a;
    (blk||card).querySelectorAll('.opt').forEach((o,i)=>o.classList.add(i===ans?'ok':'no'));
    const tip=card.querySelector('.ktip'); if(tip) tip.hidden=false;
    if(tab==='c'){
      const hit=+opt.dataset.i===ans;
      if(hit){ st.done[id]=1; delete st.weak[id]; } else { st.weak[id]=1; delete st.done[id]; }
      save(); prog();
      card.classList.toggle('weak',!hit);
      card.querySelector('.act.dn').setAttribute('aria-pressed',String(hit));
      card.querySelector('.act.wk').setAttribute('aria-pressed',String(!hit));
      const rc=card.querySelector('.react');
      const msg=hit?HIT[Math.floor(Math.random()*HIT.length)]:MISS[Math.floor(Math.random()*MISS.length)];
      rc.className='react '+(hit?'hit':'miss');
      rc.innerHTML=mochi(hit?'happy':'sad',34)+`<span class="msg">${msg}</span>`;
      rc.hidden=false;
    }
    return;
  }
  const dn=e.target.closest('.act.dn');
  if(dn){ st.done[id]?delete st.done[id]:st.done[id]=1; save(); render(); return; }
  const wk=e.target.closest('.act.wk');
  if(wk){ st.weak[id]?delete st.weak[id]:st.weak[id]=1; save(); render(); return; }
});
/* 보기 방식 전환 */
const modeBtn=document.getElementById('mode');
function drawMode(){ modeBtn.innerHTML=icon(mode==='one'?'list':'card'); }
drawMode();
modeBtn.addEventListener('click',()=>{
  mode = mode==='one'?'list':'one'; idx=0; SP.stop(); drawMode();
  try{ localStorage.setItem('n3deck:mode',mode); }catch(e){}
  render();
});
function step(n){
  const len=filtered().length; if(!len) return;
  const next=idx+n; if(next<0||next>=len) return;
  idx=next; SP.stop(); render();
}
document.getElementById('prev').addEventListener('click',()=>step(-1));
document.getElementById('next').addEventListener('click',()=>step(1));

/* 좌우 스와이프 */
let tx=0,ty=0;
const listEl=document.getElementById('list');
listEl.addEventListener('touchstart',e=>{ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; },{passive:true});
listEl.addEventListener('touchend',e=>{
  if(mode!=='one') return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) step(dx<0?1:-1);
},{passive:true});

/* 키보드 */
document.addEventListener('keydown',e=>{
  if(mode!=='one') return;
  if(e.key==='ArrowRight') step(1);
  if(e.key==='ArrowLeft') step(-1);
});

const rateBtn=document.getElementById('rate');
function drawRate(){ rateBtn.textContent='×'+SP.rates[SP.i]; }
drawRate();
rateBtn.addEventListener('click',()=>{
  SP.i=(SP.i+1)%SP.rates.length; drawRate(); SP.stop();
  try{ localStorage.setItem('n3deck:rate',SP.i); }catch(e){}
});
document.getElementById('font').addEventListener('click',e=>{
  const sys=document.body.classList.toggle('sysfont');
  e.currentTarget.setAttribute('aria-pressed',String(!sys));
  try{ localStorage.setItem('n3deck:font',sys?'sys':'round'); }catch(err){}
});
try{ if(localStorage.getItem('n3deck:font')==='sys'){
  document.body.classList.add('sysfont');
  document.getElementById('font').setAttribute('aria-pressed','false');
} }catch(err){}
document.getElementById('furi').addEventListener('click',e=>{
  const on=document.body.classList.toggle('nofuri');
  e.currentTarget.setAttribute('aria-pressed',String(!on));
});

/* ─────────── D-day ─────────── */
(function(){
  const t=new Date(); t.setHours(0,0,0,0);
  const n=Math.round((EXAM-t)/86400000);
  document.getElementById('dday').textContent = n>0?`시험까지 ${n}일 · D-${n}`:(n===0?'오늘이 시험날입니다':'수고하셨어요');
})();

document.getElementById('avatar').innerHTML=mochi('happy',24);
(async function(){ await load(); chips(); render(); })();
</script>
